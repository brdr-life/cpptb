# Upstream projects fetched by fetch.py.
#
# Every entry pins an exact commit. Nothing here is vendored into the
# repository: fetch.py clones into deps/, which is gitignored, so the tree
# stays small and provenance stays exact. Small RTL subsets that a benchmark
# elaborates directly belong in benchmarks/framework_comparison/open_cores
# instead, following the vendoring precedent there.
#
# Adding a project means adding a table here and, if its licence requires
# attribution for anything that ends up committed, a note in
# THIRD_PARTY_NOTICES.md. Fetched-only sources need no notice because they are
# never redistributed from this repository.

[ibex]
repo = "https://github.com/lowRISC/ibex.git"
# [rtl] Only count Zcmp expanded instructions as one instruction, 2026-03-19
commit = "8ed87e07e3331561bce93af1568d9b376948e701"
license = "Apache-2.0"
purpose = """
Simple System is a Verilator simulation of the Ibex core with memory and a
handful of peripherals, driven by a hand-written C++ harness. That harness is
what a cpptb port replaces, which makes the comparison like-for-like rather
than a change of methodology.
"""
# Paths a port is expected to use. Recorded for review, not enforced.
paths = [
  "examples/simple_system",
  "examples/sw/simple_system",
  "rtl",
  "vendor/lowrisc_ip",
]

[riscv_arch_test]
repo = "https://github.com/riscv-non-isa/riscv-arch-test.git"
# HEAD of main, 2026-07-26
commit = "426e1598ebc3688eaf9aba7b4a1b8a81dae9807f"
license = "BSD-3-Clause"
purpose = """
The RISC-V architectural test suite: assembly programs that exercise one
instruction each and write their results to a signature region in memory. A
harness runs a test, dumps the signature, and compares it against another
implementation's.

Where CoreMark measures steady-state simulation throughput over one long run,
this measures the other axis: many short runs, where per-test cost dominates.
The suite is also the natural place to exercise cpptb's memory backdoor, since
loading each test through it is what lets one build run every test.

Ibex is RV32IMC, so the applicable subset is I, M, C and Zifencei. The other
directories in the suite target extensions the core does not implement.
"""
paths = [
  "riscv-test-suite/rv32i_m",
  "riscv-test-suite/env",
]

[riscv_gcc15]
kind = "archive"
strip_components = 1
license = "GPL-3.0-with-GCC-exception, and the licences of the components it bundles"
purpose = """
A current RISC-V GCC, needed because riscv_toolchain is too old to assemble the
architectural tests.

That toolchain is GCC 10.2.0 with binutils 2.35, released in 2020. Binutils
gained `zifencei` as a named extension in 2.36, so every architectural test
fails to assemble on it:

    Fatal error: -march=rv32i_zicsr_zifencei: Invalid or unknown z ISA
    extension: 'zifencei'

and the newer extension names the suite uses (Zca and the rest) are unknown to
it as well. riscv_toolchain is kept rather than replaced because it is what
Ibex's own makefiles expect for the Simple System examples, and changing the
compiler that builds the CoreMark firmware would invalidate the measurement in
ports/ibex_simple_system.

xPack rather than lowRISC because lowRISC publishes no recent GCC build, and
rather than riscv-collab's release because that ships Ubuntu builds only. xPack
publishes all four host platforms this repository targets, so a Mac needs no
separate instructions.

The binary prefix is riscv-none-elf-, not riscv32-unknown-elf-.
"""

[riscv_gcc15.assets."Linux-x86_64"]
url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-x64.tar.gz"
sha256 = "aaaa8060c914851a3e5ee1ba82cc3d6f80972f90638a05c6e823a37557a33758"

[riscv_gcc15.assets."Linux-aarch64"]
url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-linux-arm64.tar.gz"
sha256 = "4e60e2a54c16385e4e2476d08240f857495d5a61609d97e1ee49f72875a6ec1e"

[riscv_gcc15.assets."Darwin-arm64"]
url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-darwin-arm64.tar.gz"
sha256 = "6588e8351455fad8aca37551f0e5a5543f3346bfa9a837cf03cbd3bdd4989f8f"

[riscv_gcc15.assets."Darwin-x86_64"]
url = "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/download/v15.2.0-1/xpack-riscv-none-elf-gcc-15.2.0-1-darwin-x64.tar.gz"
sha256 = "98e83f097b10163869dabffd58389ac8e4eb41bae0f67124569158655be593ea"

[riscv_toolchain]
kind = "archive"
url = "https://github.com/lowRISC/lowrisc-toolchains/releases/download/20250710-1/lowrisc-toolchain-gcc-rv32imcb-x86_64-20250710-1.tar.xz"
sha256 = "7da91ebcef42d60324d58d7b099855debac6c99172244df49d06bf4d9f461f5f"
platform = "Linux-x86_64"
strip_components = 1
license = "GPL-3.0-with-GCC-exception, and the licences of the components it bundles"
purpose = """
Ibex builds its example software with riscv32-unknown-elf-gcc, which nothing
else in this repository needs. rv32imcb is a superset of the rv32imc the
examples target.

Deliberately the GCC release rather than the newer LLVM ones. lowRISC's current
releases ship clang with no C library sysroot at all: riscv32-unknown-elf holds
only bin and lib, so newlib's headers are absent and CoreMark fails on
sys/types.h and then math.h. This release bundles newlib and is what Ibex's
makefiles already expect, so CC and CROSS_COMPILE need no overriding. 20250710-1
is the most recent release offering a GCC variant.

It is needed once. The firmware a port runs is committed next to the port as a
VMEM, so running a port does not require this toolchain.
"""
