# Upstream projects fetched by fetch.py.
#
# Every entry pins an exact commit. Nothing here is vendored into the
# repository: fetch.py clones into deps/, which is gitignored, so the tree
# stays small and provenance stays exact. Small RTL subsets that a benchmark
# elaborates directly belong in benchmarks/framework_comparison/open_cores
# instead, following the vendoring precedent there.
#
# Adding a project means adding a table here and, if its licence requires
# attribution for anything that ends up committed, a note in
# THIRD_PARTY_NOTICES.md. Fetched-only sources need no notice because they are
# never redistributed from this repository.

[ibex]
repo = "https://github.com/lowRISC/ibex.git"
# [rtl] Only count Zcmp expanded instructions as one instruction, 2026-03-19
commit = "8ed87e07e3331561bce93af1568d9b376948e701"
license = "Apache-2.0"
purpose = """
Simple System is a Verilator simulation of the Ibex core with memory and a
handful of peripherals, driven by a hand-written C++ harness. That harness is
what a cpptb port replaces, which makes the comparison like-for-like rather
than a change of methodology.
"""
# Paths a port is expected to use. Recorded for review, not enforced.
paths = [
  "examples/simple_system",
  "examples/sw/simple_system",
  "rtl",
  "vendor/lowrisc_ip",
]

[riscv_toolchain]
kind = "archive"
url = "https://github.com/lowRISC/lowrisc-toolchains/releases/download/20260224-1/lowrisc-toolchain-rv32imcb-x86_64-20260224-1.tar.xz"
sha256 = "528facbc6cb6f02667ce7613ab21383fca42b18cca6f4914b7160636080d3569"
platform = "Linux-x86_64"
strip_components = 1
license = "GPL-3.0-with-GCC-exception, and the licences of the components it bundles"
purpose = """
Ibex builds its example software with riscv32-unknown-elf-gcc, which nothing
else in this repository needs. This is the prebuilt toolchain the Ibex README
recommends, fetched only to produce firmware. rv32imcb is a superset of the
rv32imc the examples target.

It is needed once. The firmware a port runs is committed next to the port as a
VMEM, so running a port does not require this toolchain.
"""
