# A cpptb port of Ibex's CS registers testbench, dv/cs_registers.
#
# The design under test is ibex_cs_registers, a submodule rather than a core, so
# this needs four RTL files instead of the 141 the system-level ports elaborate.
# dut.sv wraps it to name the interface; see the comment there.

[design]
top = "cs_registers_dut"
defines = [
  # Verilator defines this itself, so the backend takes the VERILATOR branch of
  # prim_assert.sv. The slang frontend does not.
  "VERILATOR=1",
  # Enum-valued parameters reach the design as defines, as everywhere else here.
  # tb_cs_registers's fusesoc core takes the ibex_core defaults for both.
  "RV32M=ibex_pkg::RV32MFast",
  "RV32B=ibex_pkg::RV32BNone",
]
sources = [
  "../../deps/ibex/rtl/ibex_pkg.sv",
  "../../deps/ibex/rtl/ibex_csr.sv",
  "../../deps/ibex/rtl/ibex_counter.sv",
  "../../deps/ibex/rtl/ibex_cs_registers.sv",
  "dut.sv",
]
include_dirs = [
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/rtl",
]

[design.parameters]
# The defaults from tb_cs_registers.core's parameter block. The testbench's
# model is told the same values; see kPMPEnable and friends in testbench.cpp.
PMPEnable = "1"
PMPNumRegions = "4"
PMPGranularity = "0"
MHPMCounterNum = "8"
MHPMCounterWidth = "40"

[testbench]
# Upstream's model, stimulus and pass/fail sink. Listed in [testbench]
# sources rather than verilator_args because only these are fingerprinted:
# a file passed through verilator_args is compiled but not tracked, so
# editing it would not trigger a rebuild (FINDINGS C2).
sources = [
  "testbench.cpp",
  "../../deps/ibex/dv/cs_registers/model/base_register.cc",
  "../../deps/ibex/dv/cs_registers/model/register_model.cc",
  "../../deps/ibex/dv/cs_registers/reg_driver/register_transaction.cc",
  "../../deps/ibex/dv/cs_registers/env/simctrl.cc",
]
# The driver, reset driver, environment and three DPI shims are deliberately
# absent: cpptb replaces them. See the header of testbench.cpp.
include_dirs = [
  "../../deps/ibex/dv/cs_registers/model",
  "../../deps/ibex/dv/cs_registers/reg_driver",
  "../../deps/ibex/dv/cs_registers/env",
]

[build]
directory = "../../work/ibex_cs_registers"
name = "ibex_cs_registers"
target = "ibex_cs_registers"
optimization = "-O2"
# The upstream testbench drives through non-blocking assignments to dodge
# its own read-after-write hazard; deferred writes are that NBA here.
timing_backend = "verilator-direct"
deferred_writes = true
verilator_args = [
  "-Wno-fatal",
  # Upstream's own waivers for this testbench.
  "../../deps/ibex/dv/cs_registers/lint/verilator_waiver.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/lint/tools/verilator/common.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/lint/prim_assert.vlt",
]

[run]
# 10,000 transactions at up to 20 cycles apart, plus reset. Well above that so a
# hang is still caught.
timeout_cycles = 1000000
