[design.parameters]
# The -G set fusesoc passes for the small configuration, so this
# elaborates the same core the baseline measured.
RV32E = "0"
ICache = "0"
ICacheScramble = "0"
ICacheECC = "0"
BranchTargetALU = "0"
WritebackStage = "0"
SecureIbex = "0"
BranchPredictor = "0"
DbgTriggerEn = "0"
PMPEnable = "0"
PMPGranularity = "0"
PMPNumRegions = "4"
MHPMCounterNum = "0"
MHPMCounterWidth = "40"
# The firmware. This reaches prim_util_memload's $readmemh through
# ibex_simple_system's SRAMInitFile, so the program is loaded during
# elaboration and no ELF reader is needed at run time. Verilator wants a
# string parameter quoted, hence the embedded quotes.
SRAMInitFile = '"firmware/coremark.vmem"'

[testbench]
sources = ["testbench.cpp"]

[build]
directory = "../../work/ibex_simple_system"
name = "ibex_simple_system"
target = "ibex_simple_system"
optimization = "-O2"
verilator_args = [
  # ibex_id_stage.sv trips this on current Verilator; upstream's own build
  # needs the same demotion.
  "-Wno-UNOPTFLAT",
  "-Wno-fatal",
  # Upstream's lint waivers. Without these the design does not
  # elaborate cleanly; fusesoc passes the same files.
  "../../deps/ibex/vendor/lowrisc_ip/lint/tools/verilator/common.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/lint/prim_assert.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_clock_buf.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_clock_gating.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/lint/prim_cdc_rand_delay.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/lint/prim_cipher.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/lint/prim_count.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_clock_mux2.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_pad_wrapper.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_ram_1p.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_ram_1r1w.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_ram_2p.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim_generic/lint/prim_generic_rom.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/lint/prim_onehot_check.vlt",
  "../../deps/ibex/lint/verilator_waiver.vlt",
  "../../deps/ibex/vendor/lowrisc_ip/ip/prim/lint/prim_ram_1p_scr.vlt",
  "../../deps/ibex/lint/verilator_waiver.vlt",
  "../../deps/ibex/lint/verilator_waiver.vlt",
]

[run]
# CoreMark at 100 iterations runs about 40.7 million cycles. The default
# watchdog is 1 million, which stops a real software workload almost
# immediately.
timeout_cycles = 100000000
