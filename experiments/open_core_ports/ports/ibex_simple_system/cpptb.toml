# Generated once from the fusesoc file list, then committed. See README.md.
#
# Sources point at the fetched Ibex tree rather than fusesoc's assembled copy:
# all 141 files exist upstream unmodified, so building this port needs only
# `fetch.py ibex`, not fusesoc or edalize.

[design]
top = "ibex_simple_system"
defines = [
  # Verilator defines this itself, so the backend takes the VERILATOR
  # branch of prim_assert.sv and compiles assertions away. The slang
  # frontend does not, and would otherwise elaborate an assertion that
  # references a signal existing only under INC_ASSERT.
  "VERILATOR=1",
  "RVFI=1",
  "RV32M=ibex_pkg::RV32MFast",
  "RV32B=ibex_pkg::RV32BNone",
  "RV32ZC=ibex_pkg::RV32Zca",
  "RegFile=ibex_pkg::RegFileFF",
  "INSTR_CYCLE_DELAY=0",
]
