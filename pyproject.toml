[project]
name = "cpptb-codegen"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pyslang==11.0.0",
]

[project.scripts]
cpptb = "cpptb_codegen.cli:main"
cpptb-codegen = "cpptb_codegen.generate_dpi_bindings:main"
cpptb-run = "cpptb_codegen.runner:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "tools/codegen"}

[tool.setuptools.packages.find]
where = ["tools/codegen"]
include = ["cpptb_codegen*"]

[tool.setuptools.data-files]
"include/cpptb" = ["include/cpptb/*.hpp"]

[dependency-groups]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.0.4",
    "zensical>=0.0.50",
]

[tool.uv]
default-groups = []
