[project]
name = "cpptb-peakrdl"
version = "0.1.0"
description = "SystemRDL/IP-XACT register-model exporter plugin for cpptb"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = []

[project.urls]
Documentation = "https://cpptb-docs.pages.dev/verification-components/register-generation"
Repository = "https://github.com/brdr-life/cpptb"

[project.optional-dependencies]
peakrdl = ["peakrdl>=1.5,<2"]
ipxact = ["peakrdl-ipxact>=3.5,<4"]

[project.entry-points."peakrdl.exporters"]
cpptb = "cpptb_peakrdl.plugin:CppTbExporter"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cpptb_peakrdl*"]
