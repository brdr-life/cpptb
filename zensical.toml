[project]
site_name = "cpptb"
site_description = "A C++20 coroutine testbench framework for SystemVerilog simulators."
docs_dir = "docs"
site_dir = "build/docs/zensical"
extra_css = [
  "_zensical/extra.css",
  "_assets/code-tabs.css",
  "_assets/roadmap-status.css",
]
extra_javascript = ["_assets/code-tabs.js"]
nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Getting started" = "getting-started.md" },
    { "Write your first testbench" = "testbench-authoring.md" },
    { "Run tests" = "running-tests.md" },
    { "Coming from cocotb" = "coming-from-cocotb.md" },
  ] },
  { "Examples" = [
    { "Overview" = "examples.md" },
    { "Simple" = [
      { "Counter" = "examples/counter.md" },
      { "Clockless timers" = "examples/timer-only.md" },
      { "FIFO scoreboard" = "examples/fifo-scoreboard.md" },
      { "Multiple clocks" = "examples/multiclock.md" },
      { "Watchdogs and timeouts" = "examples/watchdog-timeout.md" },
    ] },
    { "Advanced" = [
      { "Component FIFO" = "examples/component-fifo.md" },
      { "APB register file" = "examples/apb-regfile.md" },
      { "APB transaction trace" = "examples/apb-trace.md" },
      { "IP-XACT register model" = "examples/ipxact-regfile.md" },
      { "Fault injection" = "examples/fault-injection.md" },
      { "Rich data" = "examples/rich-data.md" },
      { "Interfaces and inouts" = "examples/interfaces.md" },
      { "Mixed-language logging" = "examples/mixed-logging.md" },
      { "Heavy benchmarks" = "examples/heavy-benchmarks.md" },
      { "Open-source cores" = "examples/open-source-cores.md" },
      { "AES register-model oracle" = "examples/secworks-aes-regmodel.md" },
    ] },
  ] },
  { "Core concepts" = [
    { "Framework test lifecycle" = "test-lifecycle.md" },
    { "Clocking" = "clocking.md" },
    { "Scheduling" = "scheduling.md" },
    { "Structured logging" = "logging.md" },
    { "Waveforms" = "waveforms.md" },
  ] },
  { "Connect to your DUT" = [
    { "Hierarchical DUT access" = "hierarchy.md" },
    { "Interfaces and inouts" = "interfaces.md" },
    { "Four-state values" = "four-state.md" },
    { "Code generation" = "code-generation.md" },
  ] },
  { "Advanced Verification" = [
    { "Verification components" = [
      { "Overview" = "verification-components.md" },
      { "Transaction recording" = "verification-components/transaction-recording.md" },
      { "Sparse expected memory" = "verification-components/memory-model.md" },
      { "Register abstraction layer" = "memory-register-models.md" },
      { "Generate register models" = "verification-components/register-generation.md" },
      { "Standard register sequences" = "verification-components/register-sequences.md" },
    ] },
    { "Randomization" = [
      { "Overview" = "random-stimulus.md" },
      { "Side-by-side examples" = "randomization/examples.md" },
      { "Random value generation" = "randomization/value-generation.md" },
      { "Constrained transactions" = "randomization/constrained-transactions.md" },
      { "Policies and composite fields" = "randomization/policies-and-composition.md" },
      { "Solvers and diagnostics" = "randomization/solvers-and-diagnostics.md" },
      { "Functional coverage" = "randomization/functional-coverage.md" },
      { "Seeds and replay" = "randomization/reproducibility.md" },
    ] },
  ] },
  { "Internals" = [
    { "Architecture" = "architecture.md" },
    { "Performance" = "performance.md" },
  ] },
  { "Project" = [
    { "Roadmap" = "roadmap.md" },
  ] },
]

[project.theme]
variant = "modern"
features = [
  "navigation.sections",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "search.highlight",
  "content.code.copy",
]

[project.validation]
invalid_links = true
invalid_link_anchors = true
