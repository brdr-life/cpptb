<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 910"
     role="img" aria-labelledby="title description">
  <title id="title">CPPTB transaction recording architecture</title>
  <desc id="description">
    A test sequence drives an APB master and SystemVerilog DUT. A passive APB
    monitor reconstructs completed transactions from signals and publishes a
    typed observation to scoreboards, coverage, models, and a named recording
    stream. Optional driver intent uses a separate dashed stream. The recorder
    routes typed records to JSON Lines, in-memory, or future simulator sinks.
  </desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563a6"/>
    </marker>
    <style>
      .background { fill: #f8fafc; stroke: #d7dde5; stroke-width: 2; }
      .node { fill: #ffffff; stroke-width: 3; rx: 7; }
      .active { stroke: #2563a6; }
      .hardware { stroke: #56616f; }
      .passive { stroke: #15806c; }
      .consumer { stroke: #a16207; }
      .recording { stroke: #7857a6; }
      .sink { stroke: #64748b; }
      .section { fill: #334155; font: 700 16px system-ui, sans-serif; }
      .title { fill: #172033; font: 700 19px system-ui, sans-serif; text-anchor: middle; }
      .body { fill: #475569; font: 15px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #526173; font: 13px system-ui, sans-serif; text-anchor: middle; }
      .label { fill: #334155; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #4b5563; stroke-width: 3; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #4b5563; stroke-width: 2.5; }
      .branch-end { fill: none; stroke: #4b5563; stroke-width: 2.5; marker-end: url(#arrow); }
      .intent { fill: none; stroke: #2563a6; stroke-width: 3; stroke-dasharray: 10 8; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="background" x="1" y="1" width="1438" height="908" rx="7"/>

  <text class="section" x="50" y="47">ACTIVE STIMULUS AND DUT</text>

  <path class="line" d="M 270 130 L 340 130"/>
  <path class="line" d="M 560 130 L 640 130"/>
  <path class="line" d="M 860 130 L 950 130"/>

  <text class="label" x="305" y="72">request</text>
  <text class="label" x="600" y="72">drive + wait</text>
  <text class="label" x="905" y="72">sample signals</text>

  <rect class="node active" x="50" y="80" width="220" height="100"/>
  <text class="title" x="160" y="119">Test sequence</text>
  <text class="body" x="160" y="148">read / write intent</text>

  <rect class="node active" x="340" y="80" width="220" height="100"/>
  <text class="title" x="450" y="119">APB master</text>
  <text class="body" x="450" y="148">active protocol driver</text>

  <rect class="node hardware" x="640" y="80" width="220" height="100"/>
  <text class="title" x="750" y="112">SystemVerilog DUT</text>
  <text class="body" x="750" y="140">generated typed</text>
  <text class="body" x="750" y="160">signal handles</text>

  <rect class="node passive" x="950" y="80" width="250" height="100"/>
  <text class="title" x="1075" y="112">Passive APB monitor</text>
  <text class="body" x="1075" y="140">decodes setup, access,</text>
  <text class="body" x="1075" y="160">completion, and status</text>

  <text class="section" x="50" y="246">MONITOR-DERIVED GROUND-TRUTH PATH</text>

  <path class="line" d="M 1075 180 L 1075 280"/>
  <text class="label" x="1170" y="228">construct at completion</text>

  <rect class="node passive" x="770" y="280" width="610" height="100"/>
  <text class="title" x="1075" y="319">AnalysisPort&lt;TransactionObservation&lt;T&gt;&gt;</text>
  <text class="body" x="1075" y="348">begin/end sample time + disposition + typed value</text>

  <path class="branch" d="M 1075 380 L 1075 430 L 530 430"/>
  <path class="branch" d="M 805 430 L 1155 430"/>
  <path class="branch-end" d="M 530 430 L 530 470"/>
  <path class="branch-end" d="M 805 430 L 805 470"/>
  <path class="branch-end" d="M 1155 430 L 1155 470"/>

  <text class="label" x="530" y="451">completed .value</text>
  <text class="label" x="805" y="451">completed .value</text>
  <text class="label" x="1155" y="451">full observation</text>

  <rect class="node consumer" x="410" y="470" width="240" height="100"/>
  <text class="title" x="530" y="510">Scoreboard</text>
  <text class="body" x="530" y="539">compare expected</text>
  <text class="body" x="530" y="559">and observed values</text>

  <rect class="node consumer" x="685" y="470" width="240" height="100"/>
  <text class="title" x="805" y="510">Coverage / model</text>
  <text class="body" x="805" y="539">sample or predict from</text>
  <text class="body" x="805" y="559">the same publication</text>

  <rect class="node recording" x="1010" y="470" width="290" height="100"/>
  <text class="title" x="1155" y="507">Typed recording stream</text>
  <text class="body" x="1155" y="535">"apb0.observed"</text>
  <text class="small" x="1155" y="557">descriptor selected once</text>

  <path class="intent" d="M 450 180 C 450 360, 235 390, 235 650"/>
  <text class="label" x="281" y="395">optional driver intent</text>

  <rect class="node active" x="70" y="650" width="330" height="100"/>
  <text class="title" x="235" y="687">Typed intent stream</text>
  <text class="body" x="235" y="715">"apb0.intent"</text>
  <text class="small" x="235" y="737">separate, not auto-correlated</text>

  <path class="line" d="M 400 700 L 780 700"/>
  <path class="line" d="M 1155 570 C 1155 620, 1070 640, 1070 650"/>

  <rect class="node recording" x="780" y="650" width="350" height="100"/>
  <text class="title" x="955" y="686">TransactionRecorder</text>
  <text class="body" x="955" y="714">stream sequence + metadata</text>
  <text class="small" x="955" y="737">synchronous type-erased dispatch</text>

  <path class="branch" d="M 955 750 L 955 790 L 710 790"/>
  <path class="branch" d="M 955 790 L 1200 790"/>
  <path class="branch-end" d="M 710 790 L 710 815"/>
  <path class="branch-end" d="M 955 790 L 955 815"/>
  <path class="branch-end" d="M 1200 790 L 1200 815"/>

  <rect class="node sink" x="600" y="815" width="220" height="65"/>
  <text class="title" x="710" y="844">JSON Lines</text>
  <text class="small" x="710" y="866">portable trace</text>

  <rect class="node sink" x="845" y="815" width="220" height="65"/>
  <text class="title" x="955" y="844">In-memory sink</text>
  <text class="small" x="955" y="866">tests and benchmarks</text>

  <rect class="node sink" x="1090" y="815" width="220" height="65"/>
  <text class="title" x="1200" y="844">Simulator database</text>
  <text class="small" x="1200" y="866">future adapter</text>
</svg>
